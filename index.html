<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS SYSTEM</title>
    <link rel="stylesheet" href="styles.css">
     <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    
</head>
<body>
    <div class="page-container">
    <div class="container no-print">
        <header>
            <div class="header-container">
                <img class="logo" src="https://cdn.pixabay.com/photo/2024/01/25/06/56/gaming-logo-8531082_1280.png">
                <h1>BLITZ GAMING</h1>
            </div>
        </header>
        <main>
            <div id="product-list" class="grid">
                
            </div>
            <div id="cart">
                <span><h1>Cart</h1><i class="fi fi-br-shopping-cart"></i></i></i></span>
                <div id="cart-items"></div>
                <div class="total-container">
                    <hr>
                    <div class="total"><p>Total: ₱<span id="total-price">0.00</span></div>
                    <button onclick="printReceipt()" id="btnPrint">Print Receipt</button>
                </div>
            </div>
        </main>
    </div>


    <div id="receipt-print" class="print-only">
        <center>
            <h2>BLITZ GAMING</h2>
            <p>Date: <span id="receipt-date"></span></p>
        </center>
        <hr>
        <table id="receipt-table">
            <thead><tr><th>Item</th><th>Qty</th><th>Price</th></tr></thead>
            <tbody id="receipt-body"></tbody>
        </table>
        <hr>
        <h3 align="right">Total: ₱<span id="receipt-total"></span></h3>
        <center><p>Thank you for shopping!</p></center>
    </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
